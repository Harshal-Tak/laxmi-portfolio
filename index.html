<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lakshmi's Not Really a Portfolio</title>
<meta name="description" content="Lakshmi Kumavat is a visual designer working in branding, packaging, social media and illustration. Her work is arranged as a tiny pixel desktop OS.">
<meta name="theme-color" content="#ffe9f3">
<meta property="og:title" content="Lakshmi's Not Really a Portfolio">
<meta property="og:description" content="Branding, packaging, social media and illustration work by visual designer Lakshmi Kumavat.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<script>
(function () {
  try {
    var t = localStorage.getItem('lakshmi-os-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (t === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', '#160b1b');
    }
  } catch (e) {}
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%23ffffff'/%3E%3Cpath%20d='M8%201l1.8%204.6L14%207l-4.2%201.4L8%2013l-1.8-4.6L2%207l4.2-1.4z'%20fill='%23e8b93a'%20stroke='%2314234a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<div class="os">
  <header class="menubar">
    <button id="starbtn" class="starbtn" type="button" aria-haspopup="menu" aria-expanded="false"><span id="starico" aria-hidden="true"></span><span>Lakshmi OS</span></button>
    <span class="menu-role">Visual Designer</span>
    <button id="themebtn" class="themebtn" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="sun" viewBox="0 0 14 14" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M6 0h2v2H6zM6 12h2v2H6zM0 6h2v2H0zM12 6h2v2h-2zM2 2h2v2H2zM10 2h2v2h-2zM2 10h2v2H2zM10 10h2v2h-2zM5 5h4v4H5z"/></svg>
      <svg class="moon" viewBox="0 0 14 14" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M6 2h4v1H6zM4 3h5v1H4zM3 4h5v1H3zM2 5h5v1H2zM2 6h5v1H2zM2 7h5v1H2zM2 8h5v1H2zM3 9h5v1H3zM4 10h5v1H4zM6 11h4v1H6z"/></svg>
      <span id="themelabel">Light</span>
    </button>
    <span id="clock" class="clock"></span>
    <div id="menu" class="menu" role="menu" aria-label="Lakshmi OS menu" hidden></div>
  </header>

  <main id="desk" class="desk">
    <div id="decor" aria-hidden="true"></div>
    <div class="tag" aria-hidden="true">
      <div class="tag-top">Hello, I'm</div>
      <div class="tag-name" id="tagname">Lakshmi</div>
    </div>
    <div id="icons" class="icons"></div>
    <div class="hint">
      <span class="hint-fine">Double-click a folder to open it. Drag icons around.</span>
      <span class="hint-touch">Tap a folder to open it.</span>
    </div>
  </main>

  <footer id="tasks" class="taskbar" aria-label="Open windows">
    <span id="taskEmpty" class="task-empty">No windows open</span>
  </footer>
</div>

<div id="boot" class="boot">
  <div class="boot-inner">
    <div id="bootstar" aria-hidden="true"></div>
    <h1>Lakshmi OS</h1>
    <p class="sub">not really a portfolio</p>
    <div class="loadbar" aria-hidden="true"><i></i></div>
    <button id="startbtn" class="start" type="button">Press start<span class="cur" aria-hidden="true">_</span></button>
    <p class="fine">Lakshmi Kumavat &middot; Visual Designer</p>
  </div>
</div>

</body>
</html>
